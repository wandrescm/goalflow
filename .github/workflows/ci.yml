name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Restore local tools
        run: dotnet tool restore

      # The owner reviews this script and applies it as postgres; CI never connects to production (ADR-14 2.10).
      - name: Generate idempotent migration script
        run: dotnet ef migrations script --idempotent --no-build --project GoalFlow.Infrastructure --startup-project GoalFlow.Infrastructure --output artifacts/migrations.sql

      - name: Upload migration script
        uses: actions/upload-artifact@v7
        with:
          name: migrations-sql
          path: artifacts/migrations.sql
          retention-days: 14
          if-no-files-found: error

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build image (not published)
        run: docker build --tag goalflow-api:${{ github.sha }} .

      - name: Check Supabase CA certificate in image
        run: docker run --rm --entrypoint test goalflow-api:${{ github.sha }} -r /app/certs/supabase-prod-ca-2021.crt

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, docker-build]
    runs-on: ubuntu-24.04
    # Only orders the hook calls; it does not wait for Render to finish (ADR-05 2.7).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is not configured."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${{ github.sha }}" > /dev/null
